<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Images</title>
    <meta name="author" content="Daniel Streeter">
    <link rel="stylesheet" href="styles/responsive-images.css">
    </head>
    <body>
        <main>
            <div class="hero">
                <picture>
                    <source srcset="images/hero-large.webp" media="(min-width: 1000px)">
                    <source srcset="images/hero-medium.webp" media="(min-width: 550px)">
                    <img src="images/hero-small.webp" alt="Bern Switzerland Temple" width="1500" height="750">
                </picture>
            </div>
        </main>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Review</title>
        <meta name="description" content="A page to demonstrate good practices in HTML forms by simulating a product review interface">
        <meta name="author" content="Daniel Streeter">
        <link rel="stylesheet" href="styles/form.css">
        <script src="scripts/getdates.js" defer></script>
        <script src="scripts/form.js" defer></script>
    </head>
    <body>
        <header><h1>Product Review</h1></header>
        <main>
            <form method="get" action="review.html">
                <label for="product-name">Product Name*<select id="product-name" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select></label>
                <fieldset id="rating">
                <legend>Overall Rating*</legend>
                <label for="one-star">☆<input id="one-star" type="radio" name="rating" value="1" required></label>
                <label for="two-star">☆☆<input id="two-star" type="radio" name="rating" value="2" required></label>
                <label for="three-star">☆☆☆<input id="three-star" type="radio" name="rating" value="3" required></label>
                <label for="four-star">☆☆☆☆<input id="four-star" type="radio" name="rating" value="4" required></label>
                <label for="five-star">☆☆☆☆☆<input id="five-star" type="radio" name="rating" value="5" required></label>
                </fieldset>
                <label for="install-date">Date of Installation*<input id="install-date" type="date" name="installDate" required></label>
                <fieldset>
                    <legend>Which features did you find useful in the product?<span class="suggestion">Check all that apply</span></legend>
                    <label for="durability"><input id="durability" name="durability" value="durability" type="checkbox">Durability</label>
                    <label for="ease"><input id="ease" name="ease" value="ease" type="checkbox">Ease of Use</label>
                    <label for="performance"><input id="performance" name="performance" value="performance" type="checkbox">Performance</label>
                    <label for="design"><input id="design" name="design" value="design" type="checkbox">Design</label>
                </fieldset>
                <label for="written">Written Review<span class="optional">(Optional)</span><textarea id="written" name="writtenReview"></textarea></label>
                <label for="name">Your Name<span class="optional">(Optional)</span><input id="name" name="uname" type="text"></label>
                <input type="submit" value="Post Review">
            </form>
        </main>
        <footer>
        <p>&copy;<span id="currentyear"></span> Daniel Streeter, U.S.A.</p>
        <p id="lastModified"></p>
        </footer>
    </body>
</html>
